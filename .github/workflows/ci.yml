# CI: tests on both supported platforms, race detector on Linux, lint.
# Steps go through the Makefile so CI and a dev shell run identical
# commands (CGO_ENABLED=1 lives there, tree-sitter needs it).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Job-scoped log parent: the compact runner writes one private
      # directory per invocation here, and the upload step below ships
      # exactly that evidence.
      TEST_LOG_DIR: ${{ runner.temp }}/seamark-test-logs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tests
        run: make test

      # The end-to-end smoke covers what unit tests cannot: the built
      # binary, in a fresh repository, writing the agent configuration
      # and running the hook commands it wrote. It needs no agent CLI
      # and no credentials. smoke builds the binary, so there is no
      # separate build step.
      - name: Smoke
        run: make smoke

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/seamark-test-logs
          retention-days: 7
          if-no-files-found: ignore

  # The race detector multiplies runtime, so it keeps its own Linux job
  # instead of extending the ordinary matrix job. It runs the same full
  # package set as before and is scheduled independently of the ordinary
  # suites.
  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_LOG_DIR: ${{ runner.temp }}/seamark-test-logs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Race detector
        run: make test-race

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-ubuntu-race
          path: ${{ runner.temp }}/seamark-test-logs
          retention-days: 7
          if-no-files-found: ignore

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
