# Tune how mined review lessons surface (RFC-001 §5.4). Committed and
# reviewed like policy.yaml — applied at surface time, so edits take
# effect immediately without re-mining. An absent file means "defaults":
# nothing muted, nothing pinned, threshold 2.
#
# Lessons come from `seamark index --reviews` (reviews + fix commits) or
# `seamark index --fixes-only` (local fix commits only), and
# appear in `why <file>`, `orient`, and the PreToolUse edit hook.

# Minimum recurrences before a mined lesson surfaces. A single comment is
# noise; a pattern needs repetition.
threshold: 2

# Hush noise. Match by rule code and/or region (a file or directory
# prefix). An entry with both narrows to that rule in that region.
mute:
  # - rule: F541                 # we don't care about f-strings-without-placeholders
  # - region: alembic/versions   # generated migrations — ignore every lesson here

# Your exceptions that must NOT be ignored: surfaced always, for their
# region, even if mining found them once or never. The "we keep getting
# bitten by this" list. The note is shown to the agent verbatim.
pin:
  # - rule: RUF001
  #   region: scripts
  #   note: "Keep scripts ASCII — smart quotes from chat have bitten us repeatedly"
